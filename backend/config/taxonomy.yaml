# Deterministic topic taxonomy. Keywords match case-insensitively on word boundaries.
# Prefix with "re:" for a raw regex. Title or source-tag hit = 2 pts, each summary hit = 1 pt.
# A topic is assigned at >= min_score.
min_score: 2

topics:
