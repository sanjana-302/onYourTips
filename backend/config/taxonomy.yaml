    label: LLMs & Foundation Models
    keywords: [llm, llms, large language model, foundation model, foundation models,
               language model, language models, slm, slms, gpt, chatgpt,
               claude, gemini, llama, mistral, qwen, deepseek, "re:\\bgpt-?\\d", transformer,
               fine-tuning, fine-tune, finetuning, rlhf, inference, tokenizer, context window,
               open-weight, open weights]
