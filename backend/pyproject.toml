[project]
name = "onyourtips"
version = "0.1.0"
description = "Self-hosted morning briefing on AI and software, summarized by a local LLM with citations."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "sanjana-302" }]
keywords = ["llm", "rss", "news", "summarization", "evals", "ollama", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "trafilatura>=2.0",
    "tokenizers>=0.21",  # Hugging Face: exact token counts for local models, no model call
]

[project.urls]
Homepage = "https://github.com/sanjana-302/onYourTips"
Documentation = "https://github.com/sanjana-302/onYourTips/tree/main/docs"
Issues = "https://github.com/sanjana-302/onYourTips/issues"

[project.scripts]
oyt = "onyourtips.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onyourtips"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
